name: ATC-sync

on:
  schedule:
    - cron: '0 7 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test
        run: node --test tests/*.cjs
      - name: Haal De Zwaluw-data bij ATC op
        run: node scripts/update-scores.cjs
      - name: Publiceer wijzigingen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/data.json dist/app.js dist/index.html dist/de-zwaluw.ics
          if git diff --cached --quiet; then
            echo "Geen ATC-wijzigingen."
            exit 0
          fi
          git commit -m "Werk ATC-uitslagen, punten en stand van De Zwaluw bij."
          git push
